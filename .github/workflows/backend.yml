name: Backend - Build & Push to ECR
on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Gradle build (skip tests & ktlint checks)
        run: ./gradlew clean build -x test -x ktlintCheck -x ktlintMainSourceSetCheck

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push image
        id: build
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -e
          APP=today-stock/backend
          SHA=$(git rev-parse --short HEAD)
          IMAGE_SHA=$REGISTRY/$APP:$SHA
          IMAGE_LATEST=$REGISTRY/$APP:latest
          
          docker buildx build \
            --build-arg PROFILE=prod \
            --platform linux/amd64 \
            -t "$IMAGE_SHA" \
            -t "$IMAGE_LATEST" \
            --push .
          
          # Output for next step
          echo "image_tag=$SHA" >> $GITHUB_OUTPUT

      # ArgoCD 배포 저장소 업데이트
      - name: Checkout deploy repository
        uses: actions/checkout@v4
        with:
          repository: ShinSeoY/today_stock_deploy
          token: ${{ secrets.GH_PAT }}
          path: deploy-repo

      - name: Update backend image tag
        run: |
          cd deploy-repo/charts/today-stock-app
          
          # yq 설치 (YAML 파일 수정 도구)
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          
          # values.yaml에서 backend 이미지 태그 업데이트
          yq eval ".backend.image.tag = \"${{ steps.build.outputs.image_tag }}\"" -i values.yaml
          
          cat values.yaml

      - name: Commit and push changes
        run: |
          cd deploy-repo
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          
          git add charts/today-stock-app/values.yaml
          git commit -m "Update backend image tag to ${{ steps.build.outputs.image_tag }}" || echo "No changes"
          git push