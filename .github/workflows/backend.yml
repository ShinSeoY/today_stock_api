name: Backend - Build & Push to ECR
on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Gradle build (skip tests & ktlint checks)
        run: ./gradlew clean build -x test -x ktlintCheck -x ktlintMainSourceSetCheck

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -e
          APP=backend
          SHA=$(git rev-parse --short HEAD)
          IMAGE_SHA=$REGISTRY/$APP:$SHA
          IMAGE_LATEST=$REGISTRY/$APP:latest
          
          echo "REGISTRY=$REGISTRY"
          echo "IMAGE_SHA=$IMAGE_SHA"
          echo "IMAGE_LATEST=$IMAGE_LATEST"

          docker buildx build \
            --build-arg PROFILE=prod \
            -t $IMAGE_SHA \
            -t $IM
